name: Printer Effect checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  render-smoke:
    strategy:
      matrix:
        example: [modern-flyout, instant-blue-landscape]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python scripts/cli.py setup
      - run: python scripts/cli.py render --config examples/${{ matrix.example }}.json --quality draft --output output/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-diagnostics-${{ matrix.example }}
          path: |
            output/ci/*.log
            output/ci/*report.json
            output/ci/renders/
